[workspace]
members = [
    "crates/mycli-core",
    "crates/mycli-tui",
    "crates/mycli-desktop",
]
resolver = "2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# preserve_order keeps a user's settings.json key order intact when Mymux edits
# it (the statusline install path) instead of rewriting it alphabetically.
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
fs2 = "0.4"
