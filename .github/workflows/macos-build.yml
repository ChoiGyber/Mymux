name: macOS Build

# Build the macOS app (universal dmg) and attach it to an existing GitHub
# Release, then add the darwin entries to that release's latest.json so
# installed Mac apps auto-update. release.yml calls this after the
# Windows/Linux job has written latest.json; it can also be run by hand to
# (re)build the Mac assets of an existing release:
#
#   gh workflow run macos-build.yml -f tag=v0.3.4

on:
  workflow_call:
    inputs:
      tag:
        description: "Existing release tag to build and attach the dmg to"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and attach the dmg to"
        required: true
        default: "v0.3.4"

permissions:
  contents: write

jobs:
  macos:
    name: build (universal-apple-darwin)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      # The manifest helper comes from the workflow's own commit: an older tag
      # being rebuilt by hand predates scripts/add-macos-updater.mjs.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .ci-tools
          sparse-checkout: scripts/add-macos-updater.mjs
          sparse-checkout-cone-mode: false

      # Fail fast (before the expensive universal build) if any of the
      # macOS/WKWebView source guards regressed — docs/macos-webkit-gotchas.md.
      - name: Check macOS WebKit source invariants
        run: node scripts/check-macos-gotchas.mjs

      - name: Install Rust toolchain (both mac targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      # The checked-in config names a developer certificate available only
      # on the maintainer's Mac. CI has no Apple certificate, so use Tauri's
      # ad-hoc identity for this downloadable, non-notarized build.
      - name: Configure ad-hoc macOS signing
        run: |
          node -e "const fs = require('node:fs'); const path = 'crates/mycli-desktop/tauri.conf.json'; const config = JSON.parse(fs.readFileSync(path, 'utf8')); config.bundle.macOS.signingIdentity = '-'; fs.writeFileSync(path, JSON.stringify(config, null, 2) + '\n');"

      - name: Build universal dmg
        working-directory: crates/mycli-desktop
        env:
          # createUpdaterArtifacts is on: the same minisign key as the
          # Windows/Linux job signs Mymux.app.tar.gz for the auto-updater.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npx --yes @tauri-apps/cli@^2 build --target universal-apple-darwin

      - name: Attach dmg and updater archive to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release upload "$TAG" \
            ../../target/universal-apple-darwin/release/bundle/dmg/*.dmg \
            ../../target/universal-apple-darwin/release/bundle/macos/Mymux.app.tar.gz \
            --clobber
        working-directory: crates/mycli-desktop

      # Without darwin entries in latest.json an installed Mac app never sees a
      # newer version — the reason Macs stayed on 0.1.55 through 0.3.4.
      - name: Add macOS to the updater manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release download "$TAG" -p latest.json -D "$RUNNER_TEMP" --clobber
          node .ci-tools/scripts/add-macos-updater.mjs "$RUNNER_TEMP/latest.json" \
            target/universal-apple-darwin/release/bundle/macos/Mymux.app.tar.gz.sig \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/Mymux.app.tar.gz" \
            "$TAG"
          gh release upload "$TAG" "$RUNNER_TEMP/latest.json" --clobber
