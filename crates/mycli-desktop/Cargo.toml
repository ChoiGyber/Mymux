[package]
name = "mycli-desktop"
version = "0.2.0"
edition = "2024"

# The executable (and therefore the OS process / Task Manager name) is "Mymux".
# The Cargo *package* stays "mycli-desktop" so `-p mycli-desktop` keeps working.
[[bin]]
name = "Mymux"
path = "src/main.rs"

[dependencies]
mycli-core = { path = "../mycli-core" }
tauri = { version = "2.11.5", features = ["tray-icon", "unstable", "macos-private-api"] }
tauri-plugin-shell = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
# Persists the main window's size/position/maximized state across runs. Restores
# on window creation and constrains a saved position that no longer lands on a
# connected monitor, so we do not have to reimplement either.
tauri-plugin-window-state = "2"
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
dirs = { workspace = true }
fs2 = { workspace = true }
cap-std = "4"
cap-fs-ext = "4"
portable-pty = "0.9"
russh = "0.58"
russh-sftp = "2.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "process", "time"] }
async-trait = "0.1"
# Encode a clipboard image to PNG for the terminal image-paste path.
image = { version = "0.25", default-features = false, features = ["png"] }
# Direct call to Anthropic's OAuth usage endpoint for the account-wide CL badge.
# reqwest is already in the tree (via tauri-plugin-updater) with json + rustls
# enabled, so this adds no new build-toolchain requirement.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_Security_Cryptography"] }

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
